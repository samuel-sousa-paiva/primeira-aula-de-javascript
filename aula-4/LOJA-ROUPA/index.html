<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOJA DE ROUPA</title>
</head>
<body>

<h1>Loja de roupas: galeria</h1>

<button onclick="mostrarModal('Camiseta', 'R$ 49,90')">Camiseta</button>
<button onclick="mostrarModal('Calça', 'R$ 50,00')">CALÇA</button>

<div id="modal"
style="display: none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); padding:50px;">


  <div style="background: white; padding:30px; max-width: 400px; margin:auto; border-radius:10px">
    
    <h3 id="modal-titulo"></h3>
    <img src="img roupa.png" alt="49,90" width="400px" height="300px">
    <p id="modal-preco"></p>
    
    <button onclick="fecharModal()">Fechar</button>
  
  </div>
</div>

<div id="resultado" class="resultado"></div>

<script>
function mostrarModal(titulo, preco) {
    document.getElementById("modal-titulo").innerText = titulo;
    document.getElementById("modal-preco").innerText = preco;
    document.getElementById("modal").style.display = "block";
}

function fecharModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
